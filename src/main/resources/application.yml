spring:
  application:
    name: flash-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flash_booking}
    username: ${DB_USER:flash}
    password: ${DB_PASSWORD:flash}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-missing-creator-properties: true

server:
  port: ${PORT:8080}

flash-booking:
  reservation:
    max-quantity: 10
    ttl-minutes: 10
    expiry-scan-ms: 5000
    expiry-initial-delay-ms: 1000

management:
  endpoints:
    web:
      exposure:
        include: health,info
