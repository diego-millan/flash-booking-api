services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flash_booking
      POSTGRES_USER: flash
      POSTGRES_PASSWORD: flash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flash -d flash_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/flash_booking
      DB_USER: flash
      DB_PASSWORD: flash
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      replicas: 2

volumes:
  pgdata:
